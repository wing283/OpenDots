name: Supervisor Recovery Format Diagnostic

on:
  push:
    branches:
      - feature/supervisor-integration
    paths:
      - "tests/supervisor-recovery.test.ts"
      - ".github/workflows/supervisor-recovery-format.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write tests/supervisor-recovery.test.ts
          git diff --no-color -- tests/supervisor-recovery.test.ts
