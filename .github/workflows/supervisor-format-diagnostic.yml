name: Supervisor Format Diagnostic

on:
  push:
    branches:
      - feature/supervisor-integration
    paths:
      - "src/client/SupervisorRunPanel.tsx"
      - "tests/supervisor-run-panel.test.tsx"
      - ".github/workflows/supervisor-format-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write src/client/SupervisorRunPanel.tsx tests/supervisor-run-panel.test.tsx
          git diff --no-color -- src/client/SupervisorRunPanel.tsx tests/supervisor-run-panel.test.tsx
