name: Supervisor Format Diagnostic

on:
  push:
    branches:
      - feature/supervisor-integration
    paths:
      - "src/server/app.ts"
      - "src/server/headless.ts"
      - "src/server/workspace.ts"
      - "src/client/Chat.tsx"
      - "src/client/supervisor-recovery.ts"
      - "tests/headless.test.ts"
      - "tests/supervisor-recovery.test.ts"
      - "tests/supervisor-platform-turn.test.ts"
      - ".github/workflows/supervisor-format-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write src/server/app.ts src/server/headless.ts src/server/workspace.ts src/client/Chat.tsx src/client/supervisor-recovery.ts tests/headless.test.ts tests/supervisor-recovery.test.ts tests/supervisor-platform-turn.test.ts
          git diff --no-color -- src/server/app.ts src/server/headless.ts src/server/workspace.ts src/client/Chat.tsx src/client/supervisor-recovery.ts tests/headless.test.ts tests/supervisor-recovery.test.ts tests/supervisor-platform-turn.test.ts
