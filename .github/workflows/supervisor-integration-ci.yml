name: Supervisor Integration CI

on:
  push:
    branches:
      - feature/supervisor-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run Supervisor integration tests
        run: npx vitest run tests/supervisor-agent.test.ts tests/supervisor-health-status.test.tsx tests/supervisor-local-runtime.test.ts tests/supervisor-routes.test.ts tests/supervisor-run-panel.test.tsx tests/supervisor-recovery.test.ts tests/supervisor-platform-history.test.ts tests/supervisor-platform-turn.test.ts tests/page-service.test.ts
      - run: node --check tools/benchmark-supervisor-transport.mjs
      - run: node --check tools/benchmark-supervisor-live.mjs
      - run: node --check tools/soak-supervisor-integration.mjs
      - name: Run full local Supervisor mock E2E
        run: node --import tsx tools/ci-supervisor-e2e.mjs
      - run: npm run build
